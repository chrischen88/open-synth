[package]
name = "osyn-mcp"
description = "MCP server for building Serum 2 presets"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "osyn-mcp"
path = "src/main.rs"

[dependencies]
osyn-serum = { path = "../osyn-serum" }
osyn-patch = { path = "../osyn-patch" }
osyn-params = { path = "../osyn-params" }
rmcp = { version = "3.5", features = ["server", "transport-io", "macros"] }
schemars = "1"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "sync"] }
